openapi: 3.1.0
info:
  title: Cisco Secure Firewall Management Center API (Secure Client management plane)
  description: |
    The Cisco Secure Firewall Management Center (FMC) REST API configures
    remote-access VPN gateways, group policies, devices, and Secure Client
    profiles distributed to endpoints. Authentication uses a token generated
    via the generatetoken endpoint and passed as the X-auth-access-token
    header on subsequent calls; the response also returns an
    X-auth-refresh-token used to refresh.
  version: "1.0.0"
  contact:
    name: Cisco DevNet
    url: https://developer.cisco.com/docs/secure-firewall-management-center-api/
servers:
  - url: https://{fmcHost}
    variables:
      fmcHost:
        default: fmc.example.com
        description: Hostname of the Secure Firewall Management Center
security:
  - tokenAuth: []
tags:
  - name: Authentication
  - name: Devices
  - name: AccessPolicies
  - name: AccessRules
  - name: NetworkObjects
  - name: Hosts
paths:
  /api/fmc_platform/v1/auth/generatetoken:
    post:
      tags: [Authentication]
      summary: Generate an access token
      operationId: generateToken
      security:
        - basicAuth: []
      responses:
        "204":
          description: Token returned in X-auth-access-token / X-auth-refresh-token headers
          headers:
            X-auth-access-token:
              schema: { type: string }
            X-auth-refresh-token:
              schema: { type: string }
            DOMAIN_UUID:
              schema: { type: string }
        "401":
          description: Authentication failed
  /api/fmc_platform/v1/auth/refreshtoken:
    post:
      tags: [Authentication]
      summary: Refresh an access token
      operationId: refreshToken
      parameters:
        - in: header
          name: X-auth-access-token
          required: true
          schema: { type: string }
        - in: header
          name: X-auth-refresh-token
          required: true
          schema: { type: string }
      responses:
        "204":
          description: New token in response headers
  /api/fmc_config/v1/domain/{domainUUID}/devices/devicerecords:
    parameters:
      - in: path
        name: domainUUID
        required: true
        schema: { type: string }
    get:
      tags: [Devices]
      summary: List device records (managed devices)
      operationId: listDeviceRecords
      parameters:
        - in: query
          name: offset
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: expanded
          schema: { type: boolean }
      responses:
        "200":
          description: A list of device records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRecordList" }
    post:
      tags: [Devices]
      summary: Register a new device
      operationId: createDeviceRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRecord" }
      responses:
        "201":
          description: Created
  /api/fmc_config/v1/domain/{domainUUID}/devices/devicerecords/{objectId}:
    parameters:
      - in: path
        name: domainUUID
        required: true
        schema: { type: string }
      - in: path
        name: objectId
        required: true
        schema: { type: string }
    get:
      tags: [Devices]
      summary: Get a device record
      operationId: getDeviceRecord
      responses:
        "200":
          description: A device record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRecord" }
    put:
      tags: [Devices]
      summary: Update a device record
      operationId: updateDeviceRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRecord" }
      responses:
        "200":
          description: Updated
    delete:
      tags: [Devices]
      summary: Unregister a device
      operationId: deleteDeviceRecord
      responses:
        "200":
          description: Deleted
  /api/fmc_config/v1/domain/{domainUUID}/policy/accesspolicies:
    parameters:
      - in: path
        name: domainUUID
        required: true
        schema: { type: string }
    get:
      tags: [AccessPolicies]
      summary: List access policies
      operationId: listAccessPolicies
      parameters:
        - in: query
          name: offset
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: expanded
          schema: { type: boolean }
      responses:
        "200":
          description: A list of access policies
    post:
      tags: [AccessPolicies]
      summary: Create an access policy
      operationId: createAccessPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessPolicy" }
      responses:
        "201":
          description: Created access policy
  /api/fmc_config/v1/domain/{domainUUID}/policy/accesspolicies/{containerUUID}/accessrules:
    parameters:
      - in: path
        name: domainUUID
        required: true
        schema: { type: string }
      - in: path
        name: containerUUID
        required: true
        schema: { type: string }
    get:
      tags: [AccessRules]
      summary: List rules in an access policy
      operationId: listAccessRules
      responses:
        "200":
          description: A list of access rules
    post:
      tags: [AccessRules]
      summary: Create an access rule
      operationId: createAccessRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created access rule
  /api/fmc_config/v1/domain/{domainUUID}/object/networks:
    parameters:
      - in: path
        name: domainUUID
        required: true
        schema: { type: string }
    get:
      tags: [NetworkObjects]
      summary: List network objects
      operationId: listNetworkObjects
      parameters:
        - in: query
          name: offset
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: expanded
          schema: { type: boolean }
      responses:
        "200":
          description: A list of network objects
    post:
      tags: [NetworkObjects]
      summary: Create a network object
      operationId: createNetworkObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                value: { type: string }
                description: { type: string }
                type: { type: string }
      responses:
        "201":
          description: Created
  /api/fmc_config/v1/domain/{domainUUID}/object/hosts:
    parameters:
      - in: path
        name: domainUUID
        required: true
        schema: { type: string }
    get:
      tags: [Hosts]
      summary: List host objects
      operationId: listHosts
      responses:
        "200":
          description: A list of host objects
    post:
      tags: [Hosts]
      summary: Create a host object
      operationId: createHost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                value: { type: string }
      responses:
        "201":
          description: Created
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    tokenAuth:
      type: apiKey
      in: header
      name: X-auth-access-token
  schemas:
    DeviceRecord:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        hostName: { type: string }
        regKey: { type: string }
        type: { type: string }
        license_caps:
          type: array
          items: { type: string }
        accessPolicy:
          type: object
          properties:
            id: { type: string }
            type: { type: string }
            name: { type: string }
        version: { type: string }
        model: { type: string }
        modelId: { type: string }
        sw_version: { type: string }
        healthStatus: { type: string }
        deviceSerialNumber: { type: string }
    DeviceRecordList:
      type: object
      properties:
        links:
          type: object
          properties:
            self: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceRecord" }
        paging:
          type: object
          properties:
            offset: { type: integer }
            limit: { type: integer }
            count: { type: integer }
            pages: { type: integer }
    AccessPolicy:
      type: object
      properties:
        type: { type: string, enum: [AccessPolicy] }
        name: { type: string }
        defaultAction:
          type: object
          properties:
            action:
              type: string
              enum: [BLOCK, TRUST, PERMIT, NETWORK_DISCOVERY, INHERIT_FROM_PARENT]
            logBegin: { type: boolean }
            logEnd: { type: boolean }
            sendEventsToFMC: { type: boolean }
        description: { type: string }
        id: { type: string }
